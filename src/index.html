<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Velisse — Plataforma de Invitaciones Digitales</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="Velisse">
  <meta name="description" content="Velisse by KyndraSoft — Plataforma exclusiva de invitaciones digitales interactivas y gestión de eventos.">
  <link rel="icon" type="image/svg+xml" href="assets/logos/velisse.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Velisse">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&amp;family=Alex+Brush&amp;family=Allura&amp;family=Bebas+Neue&amp;family=Bodoni+Moda:ital,wght@0,400;0,600;0,700;1,400&amp;family=Cinzel+Decorative:wght@400;700&amp;family=Cinzel:wght@400;500;600;700;800;900&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&amp;family=DM+Serif+Display:ital@0;1&amp;family=Dancing+Script:wght@400;500;600;700&amp;family=Great+Vibes&amp;family=Inter:wght@300;400;500;600;700&amp;family=Italianno&amp;family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Marcellus&amp;family=MonteCarlo&amp;family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,500;6..12,600;6..12,700&amp;family=Outfit:wght@300;400;500;600;700&amp;family=Pacifico&amp;family=Parisienne&amp;family=Pinyon+Script&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=Poppins:wght@300;400;500;600;700&amp;family=Quicksand:wght@300;400;500;600;700&amp;family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Sacramento&amp;display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#181411">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <app-root>
    <style>
      .vl-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(circle at 50% 42%, #241d17 0%, #181411 58%, #100d0b 100%);
        color: #f7e6c4;
        font-family: 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif;
      }
      .vl-boot-logo-wrap {
        width: 88px;
        height: 88px;
        padding: 16px;
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(36, 29, 23, 0.95), rgba(19, 15, 12, 0.98));
        border: 1px solid rgba(212, 175, 55, 0.38);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45), 0 0 28px rgba(212, 175, 55, 0.14);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: vlBootPulse 2s ease-in-out infinite;
      }
      .vl-boot-logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .vl-boot-brand {
        font-family: 'Cinzel', 'Cormorant Garamond', Georgia, serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #f4d58d;
      }
      .vl-boot-bar {
        width: 112px;
        height: 2px;
        border-radius: 999px;
        background: rgba(212, 175, 55, 0.18);
        overflow: hidden;
        position: relative;
      }
      .vl-boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #f4c65b, transparent);
        animation: vlBootSlide 1.25s ease-in-out infinite;
      }
      @keyframes vlBootPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45), 0 0 24px rgba(212, 175, 55, 0.14); }
        50% { transform: scale(1.03); box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5), 0 0 34px rgba(244, 198, 91, 0.26); }
      }
      @keyframes vlBootSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(240%); }
      }
    </style>
    <div class="vl-boot-splash" role="status" aria-label="Cargando Velisse">
      <div class="vl-boot-logo-wrap">
        <img src="assets/logos/velisse.svg" alt="Velisse" />
      </div>
      <div class="vl-boot-brand">Velisse</div>
      <div class="vl-boot-bar" aria-hidden="true"></div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
