<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <radialGradient id="waxOuter" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#f2d999"/>
      <stop offset="42%" stop-color="#c99c44"/>
      <stop offset="78%" stop-color="#94681c"/>
      <stop offset="100%" stop-color="#5e3f0b"/>
    </radialGradient>
    <radialGradient id="waxInner" cx="60%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#e5c478"/>
      <stop offset="60%" stop-color="#b38530"/>
      <stop offset="100%" stop-color="#755010"/>
    </radialGradient>
    <filter id="sealShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1410" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Silk Ribbon Tails -->
  <path d="M78,165 L52,212 L74,202 L86,216 L102,172 Z" fill="#182e25" stroke="#c99c44" stroke-width="1"/>
  <path d="M142,165 L168,212 L146,202 L134,216 L118,172 Z" fill="#182e25" stroke="#c99c44" stroke-width="1"/>

  <!-- Organic Wax Seal Rim -->
  <g filter="url(#sealShadow)">
    <path d="M110,16 C134,14 156,25 173,41 C190,57 202,82 200,108 C198,134 188,158 169,174 C150,190 132,198 108,197 C84,196 60,188 43,170 C26,152 17,130 18,105 C19,80 29,55 47,39 C65,23 86,18 110,16 Z" fill="url(#waxOuter)"/>
    <circle cx="110" cy="107" r="71" fill="url(#waxInner)" stroke="#f6e3b4" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="110" cy="107" r="63" fill="none" stroke="#5e3f0b" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Embossed Laurel Wreath -->
    <path d="M75,142 C56,122 56,86 78,66 M145,142 C164,122 164,86 142,66" fill="none" stroke="#f7e6bc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="110" cy="58" r="3.5" fill="#f7e6bc"/>

    <!-- Monogram Crest -->
    <text x="110" y="116" text-anchor="middle" font-family="'Cinzel Decorative', 'Playfair Display', Georgia, serif" font-size="30" font-weight="700" fill="#fbf2dc" letter-spacing="2">L’O</text>
    <path d="M84,128 L136,128" stroke="#fbf2dc" stroke-width="1.2"/>
    <text x="110" y="142" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="700" fill="#fbf2dc" letter-spacing="3">ATELIER</text>
  </g>
</svg>

