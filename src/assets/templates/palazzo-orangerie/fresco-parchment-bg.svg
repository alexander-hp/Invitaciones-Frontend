<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <radialGradient id="frescoGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#fbf8f2"/>
      <stop offset="55%" stop-color="#f5efe3"/>
      <stop offset="100%" stop-color="#ebe1cf"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8893a" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#e2c37d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9b6f26" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="linenWeave" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 12h24M12 0v24" stroke="#d5c6ad" stroke-width="0.35" stroke-opacity="0.32"/>
      <circle cx="12" cy="12" r="0.6" fill="#bfa882" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="800" height="1200" fill="url(#frescoGlow)"/>
  <rect width="800" height="1200" fill="url(#linenWeave)"/>

  <!-- Subtle Renaissance Rosette Watermark -->
  <g transform="translate(400,600)" stroke="#c8b084" stroke-opacity="0.16" fill="none">
    <circle r="290" stroke-width="1"/>
    <circle r="276" stroke-width="0.6" stroke-dasharray="4 6"/>
    <circle r="210" stroke-width="0.8"/>
    <circle r="140" stroke-width="0.6"/>
    <path d="M-290,0 L290,0 M0,-290 L0,290 M-205,-205 L205,205 M-205,205 L205,-205" stroke-width="0.6"/>
    <path d="M0,-260 C35,-160 160,-35 260,0 C160,35 35,160 0,260 C-35,160 -160,35 -260,0 C-160,-35 -35,-160 0,-260 Z" stroke-width="0.9"/>
    <path d="M-180,-180 C-70,-130 70,-130 180,-180 C130,-70 130,70 180,180 C70,130 -70,130 -180,180 C-130,70 -130,-70 -180,-180 Z" stroke-width="0.8"/>
  </g>

  <!-- Outer Architectural Double Frame -->
  <rect x="22" y="22" width="756" height="1156" rx="6" fill="none" stroke="url(#goldFoil)" stroke-width="1.4"/>
  <rect x="30" y="30" width="740" height="1140" rx="4" fill="none" stroke="url(#goldFoil)" stroke-width="0.7" stroke-dasharray="2 3"/>

  <!-- Top & Bottom Corner Acanthus Flourishes -->
  <g stroke="url(#goldFoil)" fill="none" stroke-width="1.3">
    <!-- Top Left -->
    <path d="M22,78 C46,78 62,62 62,22"/>
    <path d="M30,94 C62,90 78,66 82,30"/>
    <circle cx="50" cy="50" r="4" fill="#c89d4c" fill-opacity="0.45"/>
    <!-- Top Right -->
    <path d="M778,78 C754,78 738,62 738,22"/>
    <path d="M770,94 C738,90 722,66 718,30"/>
    <circle cx="750" cy="50" r="4" fill="#c89d4c" fill-opacity="0.45"/>
    <!-- Bottom Left -->
    <path d="M22,1122 C46,1122 62,1138 62,1178"/>
    <path d="M30,1106 C62,1110 78,1134 82,1170"/>
    <circle cx="50" cy="1150" r="4" fill="#c89d4c" fill-opacity="0.45"/>
    <!-- Bottom Right -->
    <path d="M778,1122 C754,1122 738,1138 738,1178"/>
    <path d="M770,1106 C738,1110 722,1134 718,1170"/>
    <circle cx="750" cy="1150" r="4" fill="#c89d4c" fill-opacity="0.45"/>
  </g>
</svg>

