<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" fill="none">
  <defs>
    <linearGradient id="goldMolding" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B6F23"/>
      <stop offset="22%" stop-color="#E5C67B"/>
      <stop offset="48%" stop-color="#FFF4D2"/>
      <stop offset="74%" stop-color="#C99844"/>
      <stop offset="100%" stop-color="#8B601B"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B88732"/>
      <stop offset="50%" stop-color="#F7E5B4"/>
      <stop offset="100%" stop-color="#9A6E24"/>
    </linearGradient>
    <filter id="frameDrop" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0E1B15" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#frameDrop)">
    <!-- Outer Sculpted Bevel -->
    <rect x="6" y="6" width="348" height="428" rx="14" stroke="url(#goldMolding)" stroke-width="3.2"/>
    <!-- Recessed Channel Hairline -->
    <rect x="12" y="12" width="336" height="416" rx="10" stroke="url(#goldInner)" stroke-width="1.1" stroke-opacity="0.85"/>
    <!-- Inner Beaded Fillet -->
    <rect x="17" y="17" width="326" height="406" rx="8" stroke="url(#goldMolding)" stroke-width="1.4" stroke-dasharray="2 3.5"/>

    <!-- Top-Left Corner Acanthus & Rosette -->
    <g transform="translate(6, 6)">
      <path d="M0 36 C0 14, 14 0, 36 0 L52 0 C34 4, 22 12, 14 24 C8 32, 4 42, 0 52 Z" fill="url(#goldMolding)"/>
      <path d="M8 44 C10 24, 24 10, 44 8" stroke="#FFF6D6" stroke-width="1.2" fill="none"/>
      <circle cx="16" cy="16" r="6.5" fill="#152820" stroke="url(#goldMolding)" stroke-width="2"/>
      <circle cx="16" cy="16" r="2.8" fill="url(#goldInner)"/>
      <path d="M28 11 C36 11, 42 15, 48 11" stroke="url(#goldMolding)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M11 28 C11 36, 15 42, 11 48" stroke="url(#goldMolding)" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Top-Right Corner Acanthus & Rosette -->
    <g transform="translate(354, 6) scale(-1, 1)">
      <path d="M0 36 C0 14, 14 0, 36 0 L52 0 C34 4, 22 12, 14 24 C8 32, 4 42, 0 52 Z" fill="url(#goldMolding)"/>
      <path d="M8 44 C10 24, 24 10, 44 8" stroke="#FFF6D6" stroke-width="1.2" fill="none"/>
      <circle cx="16" cy="16" r="6.5" fill="#152820" stroke="url(#goldMolding)" stroke-width="2"/>
      <circle cx="16" cy="16" r="2.8" fill="url(#goldInner)"/>
      <path d="M28 11 C36 11, 42 15, 48 11" stroke="url(#goldMolding)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M11 28 C11 36, 15 42, 11 48" stroke="url(#goldMolding)" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Bottom-Left Corner Acanthus & Rosette -->
    <g transform="translate(6, 434) scale(1, -1)">
      <path d="M0 36 C0 14, 14 0, 36 0 L52 0 C34 4, 22 12, 14 24 C8 32, 4 42, 0 52 Z" fill="url(#goldMolding)"/>
      <path d="M8 44 C10 24, 24 10, 44 8" stroke="#FFF6D6" stroke-width="1.2" fill="none"/>
      <circle cx="16" cy="16" r="6.5" fill="#152820" stroke="url(#goldMolding)" stroke-width="2"/>
      <circle cx="16" cy="16" r="2.8" fill="url(#goldInner)"/>
      <path d="M28 11 C36 11, 42 15, 48 11" stroke="url(#goldMolding)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M11 28 C11 36, 15 42, 11 48" stroke="url(#goldMolding)" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Bottom-Right Corner Acanthus & Rosette -->
    <g transform="translate(354, 434) scale(-1, -1)">
      <path d="M0 36 C0 14, 14 0, 36 0 L52 0 C34 4, 22 12, 14 24 C8 32, 4 42, 0 52 Z" fill="url(#goldMolding)"/>
      <path d="M8 44 C10 24, 24 10, 44 8" stroke="#FFF6D6" stroke-width="1.2" fill="none"/>
      <circle cx="16" cy="16" r="6.5" fill="#152820" stroke="url(#goldMolding)" stroke-width="2"/>
      <circle cx="16" cy="16" r="2.8" fill="url(#goldInner)"/>
      <path d="M28 11 C36 11, 42 15, 48 11" stroke="url(#goldMolding)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M11 28 C11 36, 15 42, 11 48" stroke="url(#goldMolding)" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Top Center Imperial Cameo Crest -->
    <g transform="translate(180, 9)">
      <path d="M-38 0 C-24 -6, -12 -6, 0 0 C12 -6, 24 -6, 38 0" stroke="url(#goldMolding)" stroke-width="2" fill="none"/>
      <rect x="-18" y="-5" width="36" height="10" rx="5" fill="#152820" stroke="url(#goldMolding)" stroke-width="1.6"/>
      <polygon points="0,-4 3,0 0,4 -3,0" fill="url(#goldInner)"/>
      <circle cx="-10" cy="0" r="1.8" fill="url(#goldInner)"/>
      <circle cx="10" cy="0" r="1.8" fill="url(#goldInner)"/>
    </g>

    <!-- Bottom Center Cameo Clasp -->
    <g transform="translate(180, 431)">
      <rect x="-16" y="-4.5" width="32" height="9" rx="4.5" fill="#152820" stroke="url(#goldMolding)" stroke-width="1.5"/>
      <polygon points="0,-3.5 2.8,0 0,3.5 -2.8,0" fill="url(#goldInner)"/>
      <circle cx="-9" cy="0" r="1.5" fill="url(#goldInner)"/>
      <circle cx="9" cy="0" r="1.5" fill="url(#goldInner)"/>
    </g>
  </g>
</svg>

