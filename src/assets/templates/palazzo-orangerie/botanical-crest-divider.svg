<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 90" width="100%" height="100%">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e742b" stop-opacity="0.15"/>
      <stop offset="22%" stop-color="#c89d4c" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f2da9d" stop-opacity="1"/>
      <stop offset="78%" stop-color="#c89d4c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9e742b" stop-opacity="0.15"/>
