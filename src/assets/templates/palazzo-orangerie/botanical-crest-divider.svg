  </defs>

  <!-- Horizontal Filigree Lines -->
  <line x1="16" y1="45" x2="262" y2="45" stroke="url(#divGold)" stroke-width="1.5"/>
  <line x1="378" y1="45" x2="624" y2="45" stroke="url(#divGold)" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="245" y2="40" stroke="url(#divGold)" stroke-width="0.6"/>
  <line x1="395" y1="40" x2="550" y2="40" stroke="url(#divGold)" stroke-width="0.6"/>
  <line x1="90" y1="50" x2="245" y2="50" stroke="url(#divGold)" stroke-width="0.6"/>
  <line x1="395" y1="50" x2="550" y2="50" stroke="url(#divGold)" stroke-width="0.6"/>

  <!-- Left & Right Botanical Leaves -->
  <g fill="#c89d4c" fill-opacity="0.75" stroke="#8f631d" stroke-width="0.7">
    <path d="M262,45 C242,30 220,30 205,40 C222,47 242,48 262,45 Z"/>
    <path d="M262,45 C242,60 220,60 205,50 C222,43 242,42 262,45 Z"/>
    <path d="M378,45 C398,30 420,30 435,40 C418,47 398,48 378,45 Z"/>
    <path d="M378,45 C398,60 420,60 435,50 C418,43 398,42 378,45 Z"/>
  </g>

  <!-- Central Baroque Sunburst Crest -->
  <g transform="translate(320,45)">
    <polygon points="0,-26 7,-7 26,0 7,7 0,26 -7,7 -26,0 -7,-7" fill="#c89d4c" stroke="#7c5614" stroke-width="1"/>
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#f7e6bc"/>
    <circle cx="-38" cy="0" r="3.5" fill="#c89d4c"/>
    <circle cx="38" cy="0" r="3.5" fill="#c89d4c"/>
  </g>
