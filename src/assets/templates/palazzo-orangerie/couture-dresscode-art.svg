<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 660" width="100%" height="100%">
  <defs>
    <linearGradient id="atelierBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5eb"/>
      <stop offset="100%" stop-color="#eadbc2"/>
    </linearGradient>
    <linearGradient id="silkGown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c887"/>
      <stop offset="50%" stop-color="#c69b49"/>
      <stop offset="100%" stop-color="#8f651e"/>
    </linearGradient>
    <linearGradient id="emeraldTux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e362c"/>
      <stop offset="100%" stop-color="#0d1914"/>
    </linearGradient>
  </defs>

  <rect width="500" height="660" rx="18" fill="url(#atelierBg)"/>

  <!-- Classical Atelier Archway -->
  <path d="M55,610 L55,245 A195,195 0 0,1 445,245 L445,610 Z" fill="#f4ecdc" stroke="#b8893a" stroke-width="2"/>
  <path d="M68,598 L68,248 A182,182 0 0,1 432,248 L432,598 Z" fill="none" stroke="#b8893a" stroke-width="0.9" stroke-dasharray="4 4"/>

  <!-- Chandelier Ornament -->
  <g stroke="#b8893a" stroke-width="1.2" fill="none">
    <line x1="250" y1="52" x2="250" y2="115"/>
    <path d="M205,115 Q250,138 295,115"/>
    <circle cx="250" cy="128" r="6" fill="#d4af63"/>
    <circle cx="205" cy="115" r="3.5" fill="#d4af63"/>
    <circle cx="295" cy="115" r="3.5" fill="#d4af63"/>
  </g>

  <!-- Gentleman Silhouette (Black Tie / Emerald Velvet Tuxedo) -->
  <g transform="translate(175,195)">
    <circle cx="0" cy="24" r="18" fill="#d6bea0" stroke="#6c5328" stroke-width="1.2"/>
    <!-- Tuxedo Jacket & Lapels -->
    <path d="M-36,62 L36,62 L44,210 L-44,210 Z" fill="url(#emeraldTux)"/>
    <!-- Crisp White Shirt V & Bowtie -->
    <polygon points="-14,62 14,62 0,128" fill="#fbf8f2"/>
    <polygon points="-11,68 0,73 -11,78" fill="#0d1914"/>
    <polygon points="11,68 0,73 11,78" fill="#0d1914"/>
    <!-- Satin Peak Lapels -->
    <polygon points="-14,62 -28,110 0,128" fill="#0b1410" stroke="#b8893a" stroke-width="0.7"/>
    <polygon points="14,62 28,110 0,128" fill="#0b1410" stroke="#b8893a" stroke-width="0.7"/>
    <!-- Gold Pocket Square -->
    <polygon points="14,98 26,92 24,102" fill="#d4af63"/>
    <!-- Tailored Trousers -->
    <path d="M-32,210 L-6,210 L-10,368 L-30,368 Z" fill="#0d1914"/>
    <path d="M6,210 L32,210 L30,368 L10,368 Z" fill="#0d1914"/>
  </g>

  <!-- Lady Silhouette (Haute Couture Champagne Gold Evening Gown) -->
  <g transform="translate(315,205)">
    <circle cx="0" cy="22" r="17" fill="#dec6a8" stroke="#6c5328" stroke-width="1.2"/>
    <path d="M-12,8 C0,-4 14,2 16,16" fill="none" stroke="#8f651e" stroke-width="2"/>
    <!-- Sculpted Bodice -->
    <path d="M-24,60 C-12,54 12,54 24,60 L18,142 L-18,142 Z" fill="url(#silkGown)" stroke="#7c5614" stroke-width="1"/>
    <!-- Flowing Draped Couture Skirt & Train -->
    <path d="M-18,142 L18,142 C42,215 68,298 86,360 L-72,360 C-52,292 -34,215 -18,142 Z" fill="url(#silkGown)" stroke="#7c5614" stroke-width="1"/>
    <!-- Silk Pleat Highlights -->
    <path d="M-6,142 L-28,358 M6,142 L34,358 M0,142 L4,358" stroke="#fbf2dc" stroke-width="1.1" stroke-opacity="0.65"/>
  </g>

  <text x="250" y="586" text-anchor="middle" font-family="'Cinzel Decorative', Georgia, serif" font-size="13" fill="#6c5328" letter-spacing="4">ATELIER SARTORIAL</text>
  <rect x="14" y="14" width="472" height="632" rx="14" fill="none" stroke="#b8893a" stroke-width="1.4"/>
</svg>

