<div class="nw-page-header" *ngIf="event" style="margin-bottom: 24px;">
  <div>
    <!-- Back Link (Stylized Link) -->
    <p style="margin: 0 0 10px; font-size: 13px;">
      <a [routerLink]="backUrl" style="display: inline-flex; align-items: center; gap: 6px; color: var(--nw-accent-2); text-decoration: none; font-weight: 600; transition: color 0.2s;" class="nw-back-link">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>{{ backLabel }}</span>
      </a>
    </p>

    <!-- Main Title & Event Badge Header -->
    <div style="display: flex; align-items: center; gap: 16px; margin-top: 6px; margin-bottom: 12px; flex-wrap: wrap;">
      <!-- Larger, stylized badge box for Event Type -->
      <div class="card-icon-badge" [class]="'badge-' + getNormalizedEventType(event)" style="width: 54px; height: 54px; border-radius: 14px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.06);">
        <ng-container [ngSwitch]="getNormalizedEventType(event)">
          <!-- Boda (Anillos de Matrimonio + Diamante) -->
          <svg *ngSwitchCase="'boda'" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l1.5 3 3 1.5-3 1.5L12 11l-1.5-3L7.5 6.5 9 5z"/>
            <circle cx="9" cy="14" r="4.5"/>
            <circle cx="15" cy="14" r="4.5"/>
          </svg>
          <!-- XV -->
          <svg *ngSwitchCase="'xv'" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 19h20L19 9l-5 4-2-7-2 7-5-4L2 19z"/>
            <circle cx="12" cy="5" r="1.5" fill="currentColor"/>
          </svg>
          <!-- Graduación -->
          <svg *ngSwitchCase="'graduacion'" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c0 2 6 2 6 2s6 0 6-2v-5"/>
          </svg>
          <!-- Cumpleaños -->
          <svg *ngSwitchCase="'cumpleanos'" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/>
            <path d="M4 16h16"/>
            <path d="M12 11V7"/>
            <path d="M12 4.5a1.5 1.5 0 0 1 0-3 1.5 1.5 0 0 1 0 3z"/>
          </svg>
          <!-- Bautizo -->
          <svg *ngSwitchCase="'bautizo'" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M7 8h10"/>
          </svg>
          <!-- Default / Otro (Destello Mágico Sparkle) -->
          <svg *ngSwitchDefault viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3 1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3Z"/>
          </svg>
        </ng-container>
      </div>

      <!-- Event Title -->
      <h1 style="margin: 0; line-height: 1.2; font-size: 28px; font-family: var(--nw-font-display);">{{ event.title }}</h1>

      <!-- PREMIUM adjusted larger design button/badge for Event Type -->
      <span class="card-type-tag" style="align-self: center; font-size: 13px; font-weight: 800; padding: 6px 16px; border-radius: 30px; letter-spacing: 0.05em; text-transform: uppercase; background: var(--nw-accent-glow); border: 1.5px solid var(--nw-accent); color: var(--nw-accent); box-shadow: 0 4px 10px rgba(192, 156, 120, 0.15);">
        {{ eventTypeLabel(event) }}
      </span>
    </div>

    <!-- Event details with SVGs instead of Emojis -->
    <p style="margin: 8px 0 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 14.5px; color: var(--nw-text-2);">
      <!-- Date -->
      <span style="display: inline-flex; align-items: center; gap: 6px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--nw-text-3);">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>{{ formatDate(event.date) }}</span>
      </span>

      <!-- Location Pin -->
      <span *ngIf="event.venue?.name" style="display: inline-flex; align-items: center; gap: 6px;">
        <span style="color: var(--nw-text-3); font-size: 16px; display: inline-flex; align-items: center;">·</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--nw-text-3);">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span>{{ event.venue?.name }}</span>
      </span>

      <!-- Hosts/Anfitriones -->
      <span *ngIf="event.hosts?.length" style="display: inline-flex; align-items: center; gap: 6px;">
        <span style="color: var(--nw-text-3); font-size: 16px; display: inline-flex; align-items: center;">·</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--nw-text-3);">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>{{ event.hosts?.join(', ') }}</span>
      </span>
    </p>
  </div>
</div>
