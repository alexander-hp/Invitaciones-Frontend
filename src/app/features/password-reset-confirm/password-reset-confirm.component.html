<section class="auth-page">
  <form class="panel auth-card" (ngSubmit)="submit()">
    <p class="eyebrow">Password</p>
    <h1>Crear password nuevo</h1>
    <label>Token<input name="token" [(ngModel)]="form.token" required></label>
    <label>Password nuevo<input name="password" type="password" [(ngModel)]="form.password" minlength="8" required></label>
    <p *ngIf="success" class="success">{{ success }}</p>
    <p *ngIf="error" class="error">{{ error }}</p>
    <button class="primary" type="submit" [disabled]="loading">{{ loading ? 'Guardando...' : 'Actualizar password' }}</button>
    <a *ngIf="success" routerLink="/login">Entrar con mi password nuevo</a>
  </form>
</section>
