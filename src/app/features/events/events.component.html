<section class="page-stack">
  <header class="page-heading">
    <div>
      <p class="eyebrow">Eventos</p>
      <h1>Eventos</h1>
    </div>
  </header>

  <div class="split-layout">
    <form class="panel" (ngSubmit)="create()">
      <h2>Nuevo evento</h2>
      <div class="form-grid">
        <label class="wide">Modo
          <select name="mode" [(ngModel)]="form.mode">
            <option value="invitation">Invitacion digital completa</option>
            <option value="external_dashboard">Solo dashboard para evento externo</option>
          </select>
        </label>
        <label>Tipo
          <select name="type" [(ngModel)]="form.type">
            <option value="boda">Boda</option>
            <option value="xv">XV anos</option>
            <option value="graduacion">Graduacion</option>
            <option value="cumpleanos">Cumpleanos</option>
            <option value="bautizo">Bautizo</option>
            <option value="otro">Otro</option>
          </select>
        </label>
        <label>Titulo<input name="title" [(ngModel)]="form.title" required></label>
        <label>Fecha<input name="date" type="date" [(ngModel)]="form.date" required></label>
        <label>Anfitriones<input name="hosts" [(ngModel)]="form.hosts"></label>
        <label style="position: relative;">
          Lugar / Buscar 🔍
          <input name="venueName" [(ngModel)]="form.venueName" (input)="onVenueNameInput(form.venueName)" placeholder="Ej. Salón / Hacienda / Parroquia">
          <span *ngIf="locationSearchLoading" style="font-size: 11px; color: #2563eb; display: block; margin-top: 2px;">Buscando lugar...</span>

          <ul *ngIf="locationSearchResults?.length" style="position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); list-style: none; padding: 4px 0; margin: 4px 0 0 0; max-height: 220px; overflow-y: auto;">
            <li *ngFor="let res of locationSearchResults" (click)="selectVenueSearchResult(res)" style="padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; flex-direction: column; text-align: left;">
              <strong style="font-size: 13px; color: #1e293b;">{{ res.name }}</strong>
              <small *ngIf="res.address" style="font-size: 11px; color: #64748b; margin-top: 2px;">{{ res.address }}</small>
            </li>
          </ul>
        </label>
        <label>Direccion<input name="venueAddress" [(ngModel)]="form.venueAddress" placeholder="Calle, número, colonia, ciudad"></label>
        <label class="wide">
          Mapa / Enlace de Google Maps 📍
          <div style="display: flex; gap: 8px; margin-top: 4px;">
            <input name="mapUrl" [(ngModel)]="form.mapUrl" placeholder="https://maps.app.goo.gl/... o https://google.com/maps/..." style="flex: 1;">
            <button class="ghost small" type="button" (click)="extractInfoFromMapUrl()" [disabled]="!form.mapUrl || locationExtractLoading" style="white-space: nowrap;">
              {{ locationExtractLoading ? 'Extrayendo...' : '⚡ Extraer datos' }}
            </button>
          </div>
        </label>
        <label *ngIf="form.mode === 'external_dashboard'" class="wide">URL pagina externa<input name="externalSiteUrl" [(ngModel)]="form.externalSiteUrl" placeholder="https://..."></label>
        <label *ngIf="form.mode === 'external_dashboard'">Etiqueta externa<input name="externalSiteLabel" [(ngModel)]="form.externalSiteLabel"></label>
      </div>
      <p *ngIf="error" class="error">{{ error }}</p>
      <button class="primary" type="submit" [disabled]="saving">{{ saving ? 'Creando...' : 'Crear evento' }}</button>
    </form>

    <section class="panel">
      <h2>Mis eventos</h2>
      <p *ngIf="loading" class="notice">Cargando eventos...</p>
      <p *ngIf="!loading && !events.length" class="muted">Aun no hay eventos.</p>
      <div class="item-list">
        <a *ngFor="let event of events" [routerLink]="['/events', getId(event)]">
          <strong>{{ event.title }}</strong>
          <span>{{ event.type }} - {{ event.mode === 'external_dashboard' ? 'Dashboard externo' : 'Invitacion digital' }} - {{ event.date | date:'mediumDate' }}</span>
          <small>{{ event.status }}</small>
        </a>
      </div>
    </section>
  </div>
</section>
