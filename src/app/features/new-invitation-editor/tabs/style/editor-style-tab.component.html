<div class="nw-card" style="margin-bottom:16px;" *ngIf="invitation">
  <div class="nw-card-header" style="display:flex; align-items:center; gap:10px;">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--nw-accent);">
      <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
      <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
      <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
      <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
    </svg>
    <h3 style="margin:0;">Estilo y Paletas de Colores</h3>
  </div>
  <div class="nw-card-body" style="padding-top:16px;">
    <p style="font-size: 13px; color: var(--nw-text-3); margin-bottom: 16px;">
      Personaliza los colores de tu invitación. Toca el recuadro para abrir el selector visual de color o ingresa el código hexadecimal.
    </p>

    <div class="nw-form-grid" style="gap:16px;" *ngIf="invitation.content.palette as palette">
      <!-- Color Principal -->
      <label class="nw-label">Color principal
        <div style="display:flex; gap:8px; align-items:center; margin-top:4px;">
          <input class="nw-input" [(ngModel)]="palette.primary" style="flex:1;" placeholder="#1f2a44">
          <div style="position:relative; width:38px; height:38px; border-radius:8px; border:1.5px solid var(--nw-border); flex-shrink:0; cursor:pointer; box-shadow: var(--nw-shadow-sm); transition: transform 0.15s ease;"
            [style.background]="palette.primary" title="Toca para abrir el selector de color">
            <input type="color" [(ngModel)]="palette.primary" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; border:none; padding:0; margin:0;">
          </div>
        </div>
      </label>

      <!-- Color de Fondo -->
      <label class="nw-label">Color de fondo
        <div style="display:flex; gap:8px; align-items:center; margin-top:4px;">
          <input class="nw-input" [(ngModel)]="palette.secondary" style="flex:1;" placeholder="#f7f2ea">
          <div style="position:relative; width:38px; height:38px; border-radius:8px; border:1.5px solid var(--nw-border); flex-shrink:0; cursor:pointer; box-shadow: var(--nw-shadow-sm); transition: transform 0.15s ease;"
            [style.background]="palette.secondary" title="Toca para abrir el selector de color">
            <input type="color" [(ngModel)]="palette.secondary" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; border:none; padding:0; margin:0;">
          </div>
        </div>
      </label>

      <!-- Color de Acento -->
      <label class="nw-label">Color de acento
        <div style="display:flex; gap:8px; align-items:center; margin-top:4px;">
          <input class="nw-input" [(ngModel)]="palette.accent" style="flex:1;" placeholder="#b67b4b">
          <div style="position:relative; width:38px; height:38px; border-radius:8px; border:1.5px solid var(--nw-border); flex-shrink:0; cursor:pointer; box-shadow: var(--nw-shadow-sm); transition: transform 0.15s ease;"
            [style.background]="palette.accent" title="Toca para abrir el selector de color">
            <input type="color" [(ngModel)]="palette.accent" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; border:none; padding:0; margin:0;">
          </div>
        </div>
      </label>
    </div>

    <!-- Presets recomendados -->
    <div style="margin-top:20px; padding-top:16px; border-top:1px dashed var(--nw-border);">
      <label class="nw-label" style="margin-bottom:12px; display:block; font-weight:700;">Paletas recomendadas y temáticas</label>
      <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap:10px;">
        <button *ngFor="let preset of palettePresets" class="nw-btn nw-btn-ghost nw-btn-sm" type="button"
          (click)="onApplyPalette(preset)" style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border:1px solid var(--nw-border); border-radius:8px; text-align:left;">
          <span style="font-size:12px; font-weight:600; color:var(--nw-text);">{{ preset.name }}</span>
          <span style="display:flex; gap:4px; flex-shrink:0;">
            <span style="width:14px; height:14px; border-radius:50%; box-shadow:0 0 2px rgba(0,0,0,0.25);" [style.background]="preset.primary" [title]="'Principal: ' + preset.primary"></span>
            <span style="width:14px; height:14px; border-radius:50%; box-shadow:0 0 2px rgba(0,0,0,0.25);" [style.background]="preset.secondary" [title]="'Fondo: ' + preset.secondary"></span>
            <span style="width:14px; height:14px; border-radius:50%; box-shadow:0 0 2px rgba(0,0,0,0.25);" [style.background]="preset.accent" [title]="'Acento: ' + preset.accent"></span>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
