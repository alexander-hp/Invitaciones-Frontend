<div class="nw-card" style="margin-bottom:16px;" *ngIf="invitation">
  <div class="nw-card-header" style="display:flex; justify-content:space-between; align-items:center;">
    <div style="display:flex; align-items:center; gap:10px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--nw-accent);">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <h3 style="margin:0;">Itinerario de Eventos</h3>
      <span class="nw-pill" [class.success]="isSectionActive('itinerary')" [class.warning]="!isSectionActive('itinerary')">
        {{ isSectionActive('itinerary') ? 'Activo' : 'Inactivo' }}
      </span>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <label class="nw-switch" title="Activar / Desactivar itinerario en la invitación">
        <input type="checkbox" [checked]="isSectionActive('itinerary')" (change)="toggleSectionActive.emit({ key: 'itinerary', active: $any($event.target).checked })">
        <span class="nw-slider"></span>
      </label>
      <button class="nw-btn nw-btn-ghost nw-btn-sm" type="button" (click)="addItineraryItem.emit()" style="display:inline-flex; align-items:center; gap:6px;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Agregar horario</span>
      </button>
    </div>
  </div>
  <div class="nw-card-body" style="padding-top:16px;">
    <p *ngIf="!invitation.content.itinerary?.length" style="font-size:14px; color:var(--nw-text-3);">
      Sin horarios configurados. Agrega momentos del evento (Recepción, Ceremonia, Baile, etc.).
    </p>
    <div style="display:grid; gap:12px;">
      <div *ngFor="let item of invitation.content.itinerary; let i = index"
        style="display:flex; gap:10px; align-items:flex-start; padding:14px; background:var(--nw-surface-2); border-radius:var(--nw-radius-sm); border:1px solid var(--nw-border);">
        <div style="flex:1; display:grid; grid-template-columns:120px 1fr; gap:10px;">
          <label class="nw-label" style="font-size:11.5px;">Hora
            <input type="time" class="nw-input" [(ngModel)]="item.time" title="Seleccionar hora" style="margin-top:2px;">
          </label>
          <label class="nw-label" style="font-size:11.5px;">Título de actividad
            <input class="nw-input" [(ngModel)]="item.title" placeholder="Ceremonia / Recepción / Brindis" style="margin-top:2px;">
          </label>
          <label class="nw-label" style="grid-column:span 2; font-size:11.5px;">Descripción / Ubicación específica
            <input class="nw-input" [(ngModel)]="item.description" placeholder="Jardín principal / Salón de eventos" style="margin-top:2px;">
          </label>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px; padding-top:20px;">
          <button class="nw-btn nw-btn-ghost nw-btn-sm" type="button" (click)="moveItineraryItem.emit({ index: i, dir: -1 })"
            [disabled]="i === 0" title="Subir" style="padding:4px 8px;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
          <button class="nw-btn nw-btn-ghost nw-btn-sm" type="button" (click)="moveItineraryItem.emit({ index: i, dir: 1 })"
            [disabled]="i === invitation.content.itinerary!.length - 1" title="Bajar" style="padding:4px 8px;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <button class="nw-btn nw-btn-danger nw-btn-sm" type="button" (click)="removeItineraryItem.emit(i)" title="Eliminar" style="padding:4px 8px;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
