<section class="auth-page">
  <form class="panel auth-card" (ngSubmit)="submit()">
    <p class="eyebrow">Password</p>
    <h1>Recuperar acceso</h1>
    <p class="muted">Te enviaremos un enlace para crear un password nuevo si el email existe.</p>
    <label>Email<input name="email" type="email" [(ngModel)]="form.email" required></label>
    <p *ngIf="success" class="success">{{ success }}</p>
    <p *ngIf="error" class="error">{{ error }}</p>
    <button class="primary" type="submit" [disabled]="loading">{{ loading ? 'Enviando...' : 'Enviar enlace' }}</button>
    <a routerLink="/login">Volver a entrar</a>
  </form>
</section>
