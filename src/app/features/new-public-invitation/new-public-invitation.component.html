<!-- Hidden YouTube Iframe Audio Player -->
<div id="nw-pub-yt-player" style="position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;"></div>

<!-- Feedback Toast Notification -->
<div *ngIf="toastMessage" class="nw-pub-toast-notification" role="alert">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="toast-svg-icon">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
    <polyline points="22 4 12 14.01 9 11.01"></polyline>
  </svg>
  <span>{{ toastMessage }}</span>
</div>

<!-- Lightbox Modal -->
<div *ngIf="activeLightboxImage" class="nw-pub-lightbox-overlay" (click)="closeLightbox()">
  <div class="nw-pub-lightbox-modal" (click)="$event.stopPropagation()">
    <button class="nw-pub-lightbox-close" (click)="closeLightbox()" aria-label="Cerrar vista previa">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <img [src]="activeLightboxImage" alt="Vista previa de imagen" class="nw-pub-lightbox-img">
  </div>
</div>

<!-- Loading & Error state -->
<div *ngIf="loading" class="nw-pub-state-container">
  <div class="nw-pub-spinner"></div>
  <p class="nw-pub-state-text">Cargando tu invitación especial...</p>
</div>

<div *ngIf="error && !invitation" class="nw-pub-state-container error">
  <div class="nw-pub-state-icon">
    <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>
  <h2>Invitación no disponible</h2>
  <p>{{ error }}</p>
</div>
