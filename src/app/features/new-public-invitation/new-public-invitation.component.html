<!-- Hidden YouTube Iframe Audio Player -->
<div id="nw-pub-yt-player" style="position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;"></div>

<aside *ngIf="spotifyPlayerVisible && currentPlayingTrackUrl" class="nw-pub-spotify-player" aria-label="Reproductor de Spotify">
  <button type="button" class="nw-pub-spotify-close" (click)="toggleMusic()" aria-label="Cerrar reproductor">×</button>
  <app-visual-media-player type="audio" [url]="currentPlayingTrackUrl" label="Música del evento" presentation="native"></app-visual-media-player>
</aside>

<button *ngIf="showVisualMusicFallback()" type="button" class="nw-pub-audio-btn nw-pub-visual-music-fallback"
  [class.is-playing]="isPlayingMusic" [disabled]="!isMusicControlReady()"
  [attr.aria-label]="!isMusicControlReady() ? 'Preparando música' : (isPlayingMusic ? 'Pausar música' : 'Reproducir música')"
  [title]="!isMusicControlReady() ? 'Preparando música' : (isPlayingMusic ? 'Pausar música' : 'Reproducir música')"
  (pointerdown)="activateMusicOnPointerDown($event)" (click)="activateMusicOnClick($event)">
  <span aria-hidden="true">{{ !isMusicControlReady() ? '...' : (isPlayingMusic ? '❚❚' : '▶') }}</span>
</button>

<!-- Feedback Toast Notification -->
<div *ngIf="toastMessage" class="nw-pub-toast-notification" role="alert">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="toast-svg-icon">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
    <polyline points="22 4 12 14.01 9 11.01"></polyline>
  </svg>
  <span>{{ toastMessage }}</span>
</div>

<!-- Lightbox Modal -->
<div *ngIf="activeLightboxImage" class="nw-pub-lightbox-overlay" (click)="closeLightbox()">
  <div class="nw-pub-lightbox-modal" (click)="$event.stopPropagation()">
    <button class="nw-pub-lightbox-close" (click)="closeLightbox()" aria-label="Cerrar vista previa">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <img [src]="activeLightboxImage" alt="Vista previa de imagen" class="nw-pub-lightbox-img">
  </div>
</div>

<!-- Loading & Error state -->
<div *ngIf="loading" class="nw-pub-state-container">
  <div class="nw-pub-spinner"></div>
  <p class="nw-pub-state-text">Cargando tu invitación especial...</p>
</div>

<div *ngIf="accessRequired && !invitation" class="nw-pub-state-container access-gate">
  <h2>Acceso a la invitación</h2>
  <p>{{ accessMessage }}</p>
  <form (ngSubmit)="checkGuestAccess()" class="access-gate-form">
    <label for="guest-access-contact">Correo o teléfono registrado</label>
    <input id="guest-access-contact" name="contact" type="text" [(ngModel)]="guestAccessSingleInput" autocomplete="email" required>
    <button type="submit" [disabled]="checkingGuest">{{ checkingGuest ? 'Enviando...' : 'Solicitar enlace' }}</button>
  </form>
  <p *ngIf="error" role="alert">{{ error }}</p>
</div>

<div *ngIf="error && !invitation && !accessRequired" class="nw-pub-state-container error">
  <div class="nw-pub-state-icon">
    <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>
  <h2>Invitación no disponible</h2>
  <p>{{ error }}</p>
</div>

<!-- MAIN PUBLIC INVITATION CONTAINER -->
<ng-container *ngIf="invitation">

  <!-- BARRA DE CONTROL DE VISTA PREVIA BORRADOR -->
  <aside *ngIf="showPreviewDeviceToolbar" class="nw-draft-preview-bar" [class.is-collapsed]="previewBarCollapsed" aria-label="Controles de vista previa borrador">
    <div class="nw-draft-preview-bar-inner">
      <div class="nw-draft-preview-brand">
        <span class="nw-draft-preview-badge">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          Vista Previa Borrador
        </span>
        <span class="nw-draft-preview-title" [title]="invitationDisplayTitle">{{ invitationDisplayTitle }}</span>
        <span class="nw-draft-preview-status-pill">Modo prueba</span>
      </div>

      <!-- SELECTOR DE DISPOSITIVOS -->
      <div class="nw-draft-preview-device-switch" role="group" aria-label="Simular tamaño de pantalla">
        <button type="button" class="nw-device-btn" [class.active]="previewDevice === 'mobile'" (click)="setPreviewDevice('mobile')" title="Simular Celular (390px)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          <span>Celular (390px)</span>
        </button>

        <button type="button" class="nw-device-btn" [class.active]="previewDevice === 'tablet'" (click)="setPreviewDevice('tablet')" title="Simular Tablet (768px)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          <span>Tablet (768px)</span>
        </button>

        <button type="button" class="nw-device-btn" [class.active]="previewDevice === 'desktop'" (click)="setPreviewDevice('desktop')" title="Pantalla Completa Web">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span>Web (100%)</span>
        </button>
      </div>

      <div class="nw-draft-preview-actions">
        <button type="button" class="nw-preview-btn-ghost" (click)="closePreviewWindow()" title="Cerrar vista previa y volver al editor">
          ← Volver al editor
        </button>
        <button type="button" class="nw-preview-btn-toggle" (click)="togglePreviewBar()" [title]="previewBarCollapsed ? 'Mostrar barra' : 'Ocultar barra'">
          {{ previewBarCollapsed ? '▼' : '▲' }}
        </button>
      </div>
    </div>
  </aside>

  <!-- CONTENEDOR VIEWPORT CON EFECTO DE BORDES Y AMBIENTE LATERAL -->
  <div class="nw-preview-viewport-wrapper"
       [class.is-preview-mode]="showPreviewDeviceToolbar"
       [class.device-mode-mobile]="showPreviewDeviceToolbar && previewDevice === 'mobile'"
       [class.device-mode-tablet]="showPreviewDeviceToolbar && previewDevice === 'tablet'"
       [class.device-mode-desktop]="!showPreviewDeviceToolbar || previewDevice === 'desktop'"
       [style.--preview-ambient-bg]="ambientThemeColor">

    <div class="nw-preview-device-stage">
      <!-- Notch superior en modo celular -->
      <div *ngIf="showPreviewDeviceToolbar && previewDevice === 'mobile'" class="nw-preview-phone-notch" aria-hidden="true">
        <div class="nw-preview-phone-speaker"></div>
        <div class="nw-preview-phone-camera"></div>
      </div>

      <div class="nw-preview-content-surface">

        <!-- PLANTILLA PERSONALIZADA HTML / CSS -->
        <div *ngIf="isCustomHtmlTemplate()" class="nw-pub-custom-page-container" style="width:100vw; min-height:100vh; position:relative; background:transparent; overflow:hidden;">
          <iframe *ngIf="customHtmlSafeSrcdoc" [srcdoc]="customHtmlSafeSrcdoc"
            style="width:100vw; height:100vh; border:none; display:block; background:transparent;"
            allow="autoplay; camera; clipboard-write; encrypted-media" allowfullscreen>
          </iframe>
        </div>
