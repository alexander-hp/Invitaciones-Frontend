<!-- 🌟 NOTIFICACIONES EMERGENTES FLOTANTES (TOASTS) 🌟 -->
<div class="nw-toast-container" *ngIf="success || error">
  <!-- Mensaje de Éxito / Confirmación -->
  <div *ngIf="success" class="nw-toast success">
    <span>✨ {{ success }}</span>
    <button type="button" class="nw-toast-close" (click)="success=''">✕</button>
  </div>

  <!-- Mensaje de Error -->
  <div *ngIf="error" class="nw-toast error">
    <span>⚠️ {{ error }}</span>
    <button type="button" class="nw-toast-close" (click)="error=''">✕</button>
  </div>
</div>

<section class="nw-auth-page">
  <div class="nw-auth-card">
    
    <!-- LEFT SIDE: Form Column -->
    <div class="nw-auth-form-col">
      <div class="nw-auth-brand">
        <div class="nw-auth-logo">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
            <line x1="12" y1="22" x2="12" y2="15.5"></line>
            <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
            <polyline points="2 15.5 12 8.5 22 15.5"></polyline>
            <line x1="12" y1="2" x2="12" y2="8.5"></line>
          </svg>
        </div>
        <span class="nw-brand-text">Invitaciones.mx</span>
      </div>

      <div class="nw-auth-header">
        <h1>Recuperar acceso</h1>
        <p>Ingresa tu correo electrónico registrado y te enviaremos las instrucciones para restablecer tu contraseña.</p>
      </div>

      <form (ngSubmit)="submit()" class="nw-form-container">
        
        <div class="nw-form-group">
          <label for="email" class="nw-label">Correo Electrónico</label>
          <div class="nw-input-wrapper">
            <span class="nw-input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input 
              id="email"
              name="email" 
              type="email" 
              [(ngModel)]="form.email" 
              class="nw-input with-icon" 
              placeholder="ejemplo@evento.com"
              required>
          </div>
        </div>

        <button type="submit" class="nw-btn-primary nw-btn-submit" [disabled]="loading || !form.email">
          <span *ngIf="!loading">Enviar enlace de recuperación</span>
          <div *ngIf="loading" class="nw-spinner"></div>
        </button>

      </form>

      <div class="nw-auth-footer">
        ¿Recordaste tu contraseña? <a routerLink="/new/login">Iniciar sesión</a>
      </div>
    </div>

    <!-- RIGHT SIDE: Visual Banner Column -->
    <div class="nw-auth-visual-col" style="background-image: url('assets/login-banner.png');">
      <div class="nw-visual-overlay"></div>
      
      <div class="nw-testimonial-card">
        <!-- Quote icon -->
        <div class="nw-quote-icon">“</div>
        
        <!-- Carousel Slides -->
        <div class="nw-testimonial-slides">
          <div *ngFor="let item of testimonials; let i = index" 
               [class.active]="i === currentTestimonialIndex" 
               class="nw-testimonial-slide">
            <p class="nw-testimonial-quote">{{ item.quote }}</p>
            <div class="nw-testimonial-meta">
              <span class="nw-testimonial-author">{{ item.author }}</span>
              <span class="nw-testimonial-event">{{ item.event }}</span>
            </div>
          </div>
        </div>

        <!-- Carousel Navigation & Indicators -->
        <div class="nw-carousel-controls">
          <div class="nw-carousel-indicators">
            <span *ngFor="let item of testimonials; let i = index"
                  [class.active]="i === currentTestimonialIndex"
                  (click)="setTestimonial(i)"
                  class="nw-indicator">
            </span>
          </div>
          
          <div class="nw-carousel-arrows">
            <button type="button" class="nw-arrow-btn" (click)="prevTestimonial()" title="Anterior">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
            </button>
            <button type="button" class="nw-arrow-btn" (click)="nextTestimonial()" title="Siguiente">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>
      
    </div>

  </div>
</section>
