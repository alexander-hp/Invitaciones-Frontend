<iframe *ngIf="embedUrl" [src]="embedUrl" [title]="label || ('Reproductor de ' + providerLabel)" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<video *ngIf="!embedUrl && type === 'video' && directUrl" [src]="directUrl" controls playsinline preload="metadata"></video>
<audio *ngIf="!embedUrl && type === 'audio' && directUrl" [src]="directUrl" controls preload="metadata"></audio>
<div *ngIf="showPlaceholder && !directUrl" class="media-placeholder">Agrega una URL o sube un archivo de {{ type === 'video' ? 'video' : 'audio' }}</div>
