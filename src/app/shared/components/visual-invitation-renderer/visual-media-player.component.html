<iframe *ngIf="embedUrl && !providerButtonControl" [src]="embedUrl" [title]="label || ('Reproductor de ' + providerLabel)" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<video *ngIf="!embedUrl && type === 'video' && directUrl && !nativeError" [src]="directUrl" controls playsinline preload="metadata" (error)="handleNativeError()"></video>
<audio #nativeAudio *ngIf="!externalControl && !embedUrl && type === 'audio' && directUrl && !nativeError" [class.custom-audio-source]="customAudioControl" [src]="directUrl" [controls]="!customAudioControl" preload="metadata" (play)="updatePlaying()" (pause)="updatePlaying()" (ended)="updatePlaying()" (error)="handleNativeError()"></audio>
<button *ngIf="customAudioControl && !nativeError" type="button" class="custom-audio-button" [disabled]="externalControl && !externalReady" [attr.aria-label]="audioActionLabel" [title]="audioActionLabel" (pointerdown)="activateAudioOnPointerDown($event)" (click)="activateAudioOnClick($event)">
  <span *ngIf="showIcon" class="custom-audio-icon">{{ audioIcon }}</span>
  <span *ngIf="showLabel" class="custom-audio-label">{{ displayPlaying ? 'Pausar' : 'Música' }}</span>
</button>
<button *ngIf="providerButtonControl" type="button" class="custom-audio-button" [disabled]="externalControl && !externalReady" [attr.aria-label]="externalControl ? audioActionLabel : (providerOpen ? 'Cerrar reproductor' : 'Escuchar música')" (pointerdown)="activateProviderOnPointerDown($event)" (click)="activateProviderOnClick($event)">
  <span *ngIf="showIcon" class="custom-audio-icon">{{ !externalControl && providerOpen ? '×' : audioIcon }}</span>
  <span *ngIf="showLabel" class="custom-audio-label">{{ externalControl ? (displayPlaying ? 'Pausar' : 'Música') : (providerOpen ? 'Cerrar' : 'Escuchar') }}</span>
</button>
<div *ngIf="providerButtonControl && providerOpen && !externalControl" class="provider-player-popover" [class.spotify]="provider === 'spotify'" (click)="$event.stopPropagation()">
  <button type="button" class="provider-player-close" (click)="toggleProvider($event)" aria-label="Cerrar reproductor">×</button>
  <iframe *ngIf="providerPlaybackUrl" [src]="providerPlaybackUrl" [title]="label || ('Reproductor de ' + providerLabel)" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<div *ngIf="nativeError" class="media-error"><b>No se pudo reproducir este {{ type === 'video' ? 'video' : 'audio' }}</b><span>Usa un enlace directo a un archivo compatible o un enlace de YouTube, Spotify o Vimeo.</span><a [href]="directUrl" target="_blank" rel="noopener">Abrir enlace original</a></div>
<div *ngIf="showPlaceholder && !directUrl" class="media-placeholder">Agrega una URL o sube un archivo de {{ type === 'video' ? 'video' : 'audio' }}</div>
