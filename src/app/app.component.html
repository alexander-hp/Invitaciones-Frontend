<ng-container *ngIf="isNewLayout; else classicLayout">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #classicLayout>
  <div class="app-shell">
    <header class="app-header">
      <a routerLink="/dashboard" class="brand" aria-label="Velisse dashboard">
        <span class="brand-mark" style="background: linear-gradient(145deg, #241d17, #130f0c); border: 1px solid rgba(212, 175, 55, 0.4); padding: 5px; border-radius: 9px; box-shadow: 0 2px 8px rgba(185, 122, 22, 0.2);">
          <img src="assets/logos/velisse.svg" alt="Velisse" style="width: 100%; height: 100%; object-fit: contain; display: block;" />
        </span>
        <span style="font-family: var(--nw-font-display, inherit); font-weight: 800; font-size: 19px; letter-spacing: -0.01em;">Velisse</span>
      </a>

      <nav *ngIf="auth.isAuthenticated" class="main-nav">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/events" routerLinkActive="active">Eventos</a>
        <a routerLink="/new/dashboard" routerLinkActive="active" style="background:linear-gradient(135deg,#c09c78,#db8d80);color:#fff;border-radius:6px;padding:6px 12px;">✨ Nuevo Dashboard</a>
      </nav>

      <div class="header-actions">
        <ng-container *ngIf="user$ | async as user; else guestLinks">
          <span class="user-label">{{ user.name }}</span>
          <a routerLink="/contact" class="ghost small">Contacto</a>
          <button type="button" class="ghost small" (click)="logout()">Salir</button>
        </ng-container>
        <ng-template #guestLinks>
          <a routerLink="/contact" class="ghost small">Contacto</a>
          <a routerLink="/login" class="ghost small">Entrar</a>
          <a routerLink="/register" class="primary small">Registro</a>
        </ng-template>
      </div>
    </header>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-template>

<app-confirm-dialog></app-confirm-dialog>
